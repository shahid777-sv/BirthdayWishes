<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday 🎉</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="birthday-page">


    <!-- Background stars -->

    <div class="stars"></div>


    <!-- Fireworks -->

    <div id="fireworks"></div>


    <!-- Confetti -->

    <div id="confetti"></div>


    <!-- Main content -->

    <main class="birthday-container">


        <!-- Cake -->

        <div class="cake">
            🎂
        </div>


        <!-- Main birthday heading -->

        <h1 class="birthday-title">

            HAPPY<br>
            BIRTHDAY!

        </h1>


        <!-- Person name -->

        <h2 class="birthday-name">
            SHAHID! ❤️
        </h2>


        <!-- Sparkles -->

        <div class="sparkle-text">

            ✨ 🎉 ✨ 🎊 ✨

        </div>


        <!-- Message -->

        <p class="birthday-message">

            Wishing you a day filled with
            happiness, laughter, love and
            unforgettable moments! ❤️

        </p>


        <p class="small-message">

            Today is YOUR day! 🥳

        </p>


        <!-- Thank You -->

        <button
            class="thank-btn"
            onclick="goToParty()"
        >

            Thank You 💖

            <span>→</span>

        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
