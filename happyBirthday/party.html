<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Party? 🥳</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="party-page">


    <!-- Fireworks -->

    <div id="fireworks"></div>


    <!-- Confetti -->

    <div id="confetti"></div>


    <!-- Party question -->

    <main
        class="party-container"
        id="partyContainer"
    >


        <!-- Cake -->

        <div class="question-emoji">
            🎂
        </div>


        <!-- Small text -->

        <p class="tiny-title">

            Okay birthday star... ✨

        </p>


        <!-- Main question -->

        <h1 class="party-title">

            PARTY?

        </h1>


        <!-- Buttons -->

        <div class="buttons">


            <!-- YES -->

            <button
                id="yesBtn"
                class="yes-btn"
                onclick="sayYes()"
            >

                YES! 🥳

            </button>


            <!-- NO -->

            <button
                id="noBtn"
                class="no-btn"
                onclick="sayNo()"
            >

                NO 😈

            </button>


        </div>


        <!-- Funny messages -->

        <p id="hint"></p>


    </main>



    <!-- =================================
         FINAL CELEBRATION
    ================================= -->

    <section
        id="celebration"
        class="celebration"
    >


        <div class="celebration-content">


            <div class="celebration-emoji">

                🥳🎉

            </div>


            <h1>

                YAYYYYY!!!

            </h1>


            <h2>

                I KNEW IT! ❤️

            </h2>


            <p>

                HAPPY BIRTHDAY! 🎂

            </p>


            <div class="celebration-icons">

                🎈 🎊 🎁 🎊 🎈

            </div>


        </div>


    </section>


    <script src="script.js"></script>

</body>

</html>
